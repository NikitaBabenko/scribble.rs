# The only externally reachable listener. All paths share the same guard.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 2k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # $server_name is constant for the one server; client-controlled IPs cannot
    # split these global limits. Counts include active upgraded connections.
    limit_conn_zone $server_name zone=instance_connections:64k;
    limit_req_zone $server_name zone=instance_requests:64k rate=20r/s;
    limit_conn_status 429;
    limit_req_status 429;
    server {
        listen 8080 default_server;
        server_name _;
        limit_conn instance_connections 16;
        limit_req zone=instance_requests burst=40 nodelay;
        # CONNECT and other unsupported methods never reach the old Go server.
        if ($request_method !~ ^(GET|HEAD|POST|PATCH|OPTIONS)$) { return 405; }
        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_read_timeout 30s;
            proxy_send_timeout 15s;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Do not forward attacker-supplied address chains. This deliberately
            # records the last proxy hop, not a verified end-user address.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            # Prevent Go's affected Range parser from receiving Range input.
            proxy_set_header Range "";
            proxy_set_header If-Range "";
        }
    }
}
